version: '3.8'

services:
  fleetwise:
    build:
      context: .
      dockerfile: Dockerfile
    image: fleetwise:latest
    container_name: fleetwise-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/data/fleetwise.db
      - STORAGE_DIR=/data/proofs
      - BACKUP_DIR=/data/backups
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env (generate with openssl rand -hex 32)}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set in .env (generate with openssl rand -hex 32)}
      - OTP_HMAC_SECRET=${OTP_HMAC_SECRET:?OTP_HMAC_SECRET must be set in .env (generate with openssl rand -hex 32)}
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      - NOTIFICATIONS_ENABLED=${NOTIFICATIONS_ENABLED:-false}
      - LOG_LEVEL=info
      - CORS_ORIGIN=*
    volumes:
      - fleetwise_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:' + (process.env.PORT || 3000) + '/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  fleetwise_data:
    driver: local
