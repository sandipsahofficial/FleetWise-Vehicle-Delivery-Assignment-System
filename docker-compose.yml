version: '3.8'

services:
  fleetwise:
    build:
      context: .
      dockerfile: Dockerfile
    image: fleetwise:latest
    container_name: fleetwise-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/fleetwise.db
      - JWT_SECRET=${JWT_SECRET:-production_secure_jwt_access_secret_please_change_in_env_file}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-production_secure_jwt_refresh_secret_please_change_in_env_file}
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminSecurePassword123!}
      - LOG_LEVEL=info
      - CORS_ORIGIN=*
    volumes:
      - fleetwise_data:/app/data
      - fleetwise_proofs:/app/storage/proofs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  fleetwise_data:
    driver: local
  fleetwise_proofs:
    driver: local
