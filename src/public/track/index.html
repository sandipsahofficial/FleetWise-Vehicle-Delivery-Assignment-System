<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FleetWise — Live Shipment Tracking</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/track/track.css">
</head>
<body>
  <div class="tracking-container">
    <header class="tracking-header">
      <div class="logo-group">
        <span class="logo-icon">🚚</span>
        <h1 class="logo-title">FleetWise Tracking</h1>
      </div>
      <div id="trackingStatusBadge" class="badge-status badge-pending">Loading...</div>
    </header>

    <main id="trackingMain">
      <!-- Loading State -->
      <div id="loadingState" class="tracking-card" style="text-align: center; padding: 40px 20px;">
        <p style="color: #64748b;">Retrieving shipment details...</p>
      </div>

      <!-- Error State -->
      <div id="errorState" class="tracking-card" style="display: none; text-align: center; padding: 40px 20px;">
        <div style="font-size: 32px; margin-bottom: 12px;">🔍</div>
        <h3 id="errorTitle" style="margin-bottom: 8px;">Shipment Not Found</h3>
        <p id="errorMessage" style="color: #64748b; font-size: 14px;">This tracking link is invalid, expired, or has been revoked.</p>
      </div>

      <!-- Active Content -->
      <div id="contentState" class="tracking-card" style="display: none;">
        <h2 id="trackingStageText" style="font-size: 20px; font-weight: 700; margin-bottom: 4px;">Out for Delivery</h2>
        <p id="deliveryMeta" style="font-size: 13px; color: #64748b; margin-bottom: 16px;">Shipment in progress</p>

        <!-- Progress Timeline -->
        <div class="timeline">
          <div class="timeline-step" id="step_pending">
            <div class="step-dot">1</div>
            <div class="step-label">Order Received</div>
          </div>
          <div class="timeline-step" id="step_assigned">
            <div class="step-dot">2</div>
            <div class="step-label">Dispatched</div>
          </div>
          <div class="timeline-step" id="step_in_transit">
            <div class="step-dot">3</div>
            <div class="step-label">Out for Delivery</div>
          </div>
          <div class="timeline-step" id="step_delivered">
            <div class="step-dot">4</div>
            <div class="step-label">Delivered</div>
          </div>
        </div>

        <!-- Live Vehicle Map (in_transit only) -->
        <div id="mapWrapper" class="map-wrapper" style="display: none;"></div>

        <!-- Destination Area (Coarse privacy) -->
        <div class="route-info" id="destinationAreaWrapper" style="display: none;">
          <div class="route-point">
            <span class="point-icon">🏁</span>
            <div>
              <div class="point-label">Destination Area</div>
              <div class="point-val" id="destinationArea">—</div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/track/track.js"></script>
</body>
</html>
