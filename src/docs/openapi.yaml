openapi: 3.0.3
info:
  title: FleetWise — Vehicle & Delivery Assignment System API
  version: 1.0.0
  description: >
    Enterprise-grade, real-time fleet management and delivery dispatch API.
    Provides strict resource conflict prevention, atomic ACID assignments,
    deterministic delivery lifecycle management, role-based access control, and
    driver-scoped operational endpoints.
servers:
  - url: /
    description: Current Host
paths:
  /auth/login:
    post:
      summary: User authentication
      description: Exchanges username and password for JWT access and refresh token
        pair. Rate-limited.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: Str0ngP@ssw0rd!
      responses:
        "200":
          description: Login successful
        "401":
          description: Invalid credentials
        "429":
          description: Too many attempts, rate limit exceeded
  /auth/refresh:
    post:
      summary: Refresh access token
      description: Submits a valid refresh token, revokes it, and issues a fresh token pair.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Token rotated and fresh access token issued
        "401":
          description: Revoked or expired refresh token
  /auth/register:
    post:
      summary: Register new user (Admin only)
      description: Creates a user account with role admin, dispatcher, or driver.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
                - role
              properties:
                username:
                  type: string
                  example: dispatcher1
                password:
                  type: string
                  example: Str0ngP@ssw0rd!
                role:
                  type: string
                  enum:
                    - admin
                    - dispatcher
                    - driver
                  example: dispatcher
                driver_id:
                  type: string
                  nullable: true
                  example: DRV-A100
      responses:
        "201":
          description: User registered successfully
        "403":
          description: Admin authorization required
  /auth/me:
    get:
      summary: Get current authenticated user profile
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user profile
  /vehicles:
    get:
      summary: List fleet vehicles
      tags:
        - Vehicles
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - available
              - assigned
              - maintenance
              - inactive
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of vehicles
    post:
      summary: Register new vehicle
      tags:
        - Vehicles
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - registration_number
                - type
                - capacity
              properties:
                registration_number:
                  type: string
                  example: TRK-9000
                type:
                  type: string
                  example: Box Truck
                capacity:
                  type: number
                  example: 2500
                status:
                  type: string
                  enum:
                    - available
                    - maintenance
                    - inactive
                  default: available
      responses:
        "201":
          description: Vehicle created
  /drivers:
    get:
      summary: List drivers
      tags:
        - Drivers
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of drivers
    post:
      summary: Register driver
      tags:
        - Drivers
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - phone
              properties:
                name:
                  type: string
                  example: Michael Brown
                phone:
                  type: string
                  example: +1-555-0199
                availability_status:
                  type: string
                  enum:
                    - available
                    - unavailable
                  default: available
      responses:
        "201":
          description: Driver registered
  /deliveries:
    get:
      summary: List deliveries
      description: Returns deliveries. When accessed by a driver, automatically scopes
        to only that driver's assignments.
      tags:
        - Deliveries
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Deliveries list
    post:
      summary: Create delivery request
      tags:
        - Deliveries
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pickup_address
                - dropoff_address
                - scheduled_time
              properties:
                pickup_address:
                  type: string
                  example: 100 Main St
                dropoff_address:
                  type: string
                  example: 500 Market St
                scheduled_time:
                  type: string
                  format: date-time
                priority:
                  type: string
                  enum:
                    - low
                    - medium
                    - high
                    - urgent
                  default: medium
                required_capacity:
                  type: number
                  default: 0
      responses:
        "201":
          description: Delivery created in pending state
  /deliveries/{id}/assign:
    post:
      summary: Atomically assign vehicle and driver
      tags:
        - Deliveries
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vehicle_id
                - driver_id
              properties:
                vehicle_id:
                  type: string
                driver_id:
                  type: string
      responses:
        "200":
          description: Resources assigned atomically
        "409":
          description: Resource conflict or vehicle/driver already occupied
  /deliveries/{id}/status:
    patch:
      summary: Transition delivery status
      description: Transitions along deterministic lifecycle state machine. Drivers
        can only update their assigned deliveries.
      tags:
        - Deliveries
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - pending
                    - assigned
                    - in_transit
                    - delivered
                    - cancelled
      responses:
        "200":
          description: Status updated
  /health:
    get:
      summary: System health check
      tags:
        - System
      responses:
        "200":
          description: Health details
  /api/track/{token}:
    get:
      summary: Public customer tracking endpoint
      tags:
        - Tracking
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Data-minimized delivery status and progress
        "404":
          description: Tracking link not found or expired
  /deliveries/{id}/complete-otp:
    post:
      summary: Complete delivery with 6-digit customer OTP
      tags:
        - Proof of Delivery
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otp
              properties:
                otp:
                  type: string
                  pattern: ^[0-9]{6}$
                lat:
                  type: number
                lng:
                  type: number
      responses:
        "200":
          description: Delivery completed
        "400":
          description: Invalid OTP or expired
        "403":
          description: OTP locked or driver access denied
  /deliveries/{id}/complete-photo:
    post:
      summary: Complete delivery with photo upload
      tags:
        - Proof of Delivery
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - photo
              properties:
                photo:
                  type: string
                  format: binary
                lat:
                  type: number
                lng:
                  type: number
      responses:
        "200":
          description: Delivery completed with photo proof
        "400":
          description: Invalid file type or oversized upload
  /deliveries/{id}/proof/photo:
    get:
      summary: Stream authenticated proof photo
      tags:
        - Proof of Delivery
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image binary stream (JPEG, PNG, WebP)
        "403":
          description: Access denied
  /deliveries/{id}/otp/regenerate:
    post:
      summary: Regenerate customer OTP (admin/dispatcher only)
      tags:
        - Proof of Delivery
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: New OTP generated
  /deliveries/{id}/contact:
    get:
      summary: Get customer contact info (admin/dispatcher only)
      tags:
        - Deliveries
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer contact details
        "403":
          description: Forbidden for driver
    put:
      summary: Update customer contact and consent (admin/dispatcher only)
      tags:
        - Deliveries
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                consent:
                  type: boolean
      responses:
        "200":
          description: Contact updated
        "403":
          description: Forbidden for driver
  /api/customers:
    post:
      summary: Register customer contact for delivery notifications
      tags:
        - Customers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - delivery_id
                - name
                - email
              properties:
                delivery_id:
                  type: string
                name:
                  type: string
                email:
                  type: string
                  format: email
                phone:
                  type: string
                consent:
                  type: boolean
      responses:
        "201":
          description: Customer contact registered
        "400":
          description: Validation error
  /api/customers/{deliveryId}:
    get:
      summary: Get customer contact for delivery
      tags:
        - Customers
      security:
        - bearerAuth: []
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Customer contact
        "404":
          description: Not found
    delete:
      summary: Anonymize or scrub customer contact details
      tags:
        - Customers
      security:
        - bearerAuth: []
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contact anonymized
  /api/notifications/outbox:
    get:
      summary: List transactional notification outbox queue entries
      tags:
        - Notifications
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - pending
              - processing
              - sent
              - failed
      responses:
        "200":
          description: Outbox entries
  /api/maintenance/schedules:
    post:
      summary: Create scheduled maintenance for a vehicle
      tags:
        - Maintenance
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vehicle_id
                - service_type
              properties:
                vehicle_id:
                  type: string
                service_type:
                  type: string
                due_date:
                  type: string
                  format: date
                due_odometer:
                  type: number
                notes:
                  type: string
      responses:
        "201":
          description: Schedule created
    get:
      summary: List maintenance schedules
      tags:
        - Maintenance
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of schedules
  /api/maintenance/overdue:
    get:
      summary: Get overdue maintenance schedules
      tags:
        - Maintenance
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of overdue schedules
  /api/maintenance/records:
    post:
      summary: Record completed maintenance with monotonic odometer update
      tags:
        - Maintenance
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vehicle_id
                - service_type
                - odometer
                - cost
              properties:
                vehicle_id:
                  type: string
                service_type:
                  type: string
                odometer:
                  type: number
                cost:
                  type: number
                notes:
                  type: string
      responses:
        "201":
          description: Maintenance recorded
  /api/fuel-logs:
    post:
      summary: Submit fuel log (drivers scoped to currently assigned vehicle)
      tags:
        - Fuel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vehicle_id
                - liters
                - cost
                - odometer
              properties:
                vehicle_id:
                  type: string
                liters:
                  type: number
                cost:
                  type: number
                odometer:
                  type: number
                logged_at:
                  type: string
      responses:
        "201":
          description: Fuel log saved
    get:
      summary: List fuel logs
      tags:
        - Fuel
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of fuel logs
  /api/reports/deliveries/csv:
    get:
      summary: Export deliveries CSV report
      tags:
        - Reports
      security:
        - bearerAuth: []
      responses:
        "200":
          description: CSV file attachment
  /api/reports/summary/pdf:
    get:
      summary: Export executive summary PDF report
      tags:
        - Reports
      security:
        - bearerAuth: []
      responses:
        "200":
          description: PDF file attachment
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
